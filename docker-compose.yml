version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: recover-ai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - recover-ai-network

  backend:
    build: ./backend
    container_name: recover-ai-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - recover-ai-network
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: recover-ai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - recover-ai-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:

networks:
  recover-ai-network:
    driver: bridge